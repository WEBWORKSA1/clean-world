name: Refresh live data

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", "data/cities.json"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate share images if missing
        run: |
          if [ ! -f assets/img/og.png ]; then pip install --quiet pillow && python scripts/make_images.py; fi
      - name: Refresh data and rebuild
        run: python scripts/update_data.py
      - name: Commit changes
        run: |
          git config user.name "clean-world-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data assets/img
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: refresh live data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
